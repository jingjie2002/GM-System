{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Vision UI 数据管理系统</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* --- 登录页专属样式 --- */
        html, body {
            height: 100%;
            background-color: #0b0e1f !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* 顶部品牌区域 */
        .navbar-minimal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 40px;
        }
        .brand-logo {
            color: #fff;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* 左侧背景图容器 */
        .auth-bg-wrapper {
            position: relative;
            margin: 24px;
            height: calc(100vh - 48px);
            border-radius: 24px;
            overflow: hidden;
            background: url("{% static 'img/submit.png' %}") center center / cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(6, 11, 40, 0.1) 0%, #060b28 100%);
            z-index: -1;
        }

        /* 右侧登录卡片 (磨砂毛玻璃效果) */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(22, 27, 59, 0.6); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* 表单元素样式 */
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            margin-left: 4px;
            margin-bottom: 8px;
        }
        .form-control-auth {
            background-color: rgba(15, 21, 53, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 18px !important;
            color: #fff !important;
            padding: 14px 20px !important;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .form-control-auth:focus {
            border-color: #0075ff !important;
            box-shadow: 0 0 0 4px rgba(0, 117, 255, 0.15) !important;
            background-color: rgba(15, 21, 53, 0.8) !important;
        }
        .form-control-auth::placeholder {
            color: rgba(160, 174, 192, 0.6);
            font-size: 0.85rem;
        }

        /* 登录按钮 */
        .btn-signin {
            background: #0075ff !important;
            border: none;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            height: 52px;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 117, 255, 0.3);
        }
        .btn-signin:hover {
            transform: translateY(-2px);
            background: #006ae6 !important;
            box-shadow: 0 6px 20px rgba(0, 117, 255, 0.4);
        }

        /* 开关样式适配 */
        .form-switch .form-check-input {
            width: 38px;
            height: 19px;
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
        .form-switch .form-check-input:checked {
            background-color: #0075ff;
            border-color: #0075ff;
        }

        /* 底部版权 */
        .auth-footer {
            position: absolute;
            bottom: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar-minimal">
        <a href="#" class="brand-logo">VISION UI FREE</a>
    </div>

    <div class="container-fluid h-100 p-0">
        <div class="row g-0 h-100">
            
            <div class="col-12 col-xl-6 d-none d-xl-flex align-items-center justify-content-center">
                <div class="auth-bg-wrapper w-100">
                    <div class="auth-overlay"></div>
                    <div class="position-relative z-2 px-5">
                        <p class="text-white fw-bold tracking-wide text-uppercase mb-2 opacity-80" style="letter-spacing: 4px; font-size: 12px;">Inspired by the future:</p>
                        <h2 class="text-white fw-bold display-5 mb-0" style="letter-spacing: 1px; line-height: 1.2;">THE VISION UI<br>DASHBOARD</h2>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-6 d-flex flex-column align-items-center justify-content-center min-vh-100 px-3 position-relative">
                
                <div class="text-center mb-5">
                    <h2 class="text-white fw-bold mb-2">Nice to see you!</h2>
                    <p class="text-secondary opacity-80 small">请输入您的账号和密码进入管理系统</p>
                </div>

                <div class="auth-card">
                    <form method="POST" action="">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label">账号 / 邮箱</label>
                            <input type="text" name="username" class="form-control form-control-auth" placeholder="您的登录账号" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control form-control-auth" placeholder="您的登录密码" required>
                        </div>
                        
                        <div class="form-check form-switch mb-4 ms-1">
                            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                            <label class="form-check-label text-white small opacity-75 ms-2" for="rememberMe" style="font-size: 13px; cursor: pointer;">记住登录状态</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-signin w-100 text-uppercase">
                            登 录
                        </button>
                    </form>
                </div>

                <div class="auth-footer">
                    <p class="text-secondary opacity-50 small mb-0" style="font-size: 11px;">
                        @ 2025, Vision UI Dashboard. Created for a better management.
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
